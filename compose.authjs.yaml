services:
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      AUTH_URL: http://localhost:${WEB_PORT:-8080}
      AUTH_SECRET: "${SAPPHIRE_AUTH_SECRET:?Set SAPPHIRE_AUTH_SECRET}"
      AUTH_KEYCLOAK_ID: sapphire-web
      AUTH_KEYCLOAK_SECRET: "${SAPPHIRE_OIDC_CLIENT_SECRET:?Set SAPPHIRE_OIDC_CLIENT_SECRET}"
      AUTH_KEYCLOAK_ISSUER: http://localhost:${SAPPHIRE_IDENTITY_PORT:-8180}/realms/sapphire
      SAPPHIRE_IDENTITY_INTERNAL_ORIGIN: http://identity:8080
      SAPPHIRE_INTERNAL_API_URL: http://api:8000/
      SAPPHIRE_AI_REVIEW_PROXY_TOKEN: "${SAPPHIRE_AI_REVIEW_PROXY_TOKEN:-}"
    depends_on:
      identity:
        condition: service_started

  api:
    environment:
      SAPPHIRE_AI_REVIEW_REQUIRE_PROXY: "1"
      SAPPHIRE_AI_REVIEW_PROXY_TOKEN: "${SAPPHIRE_AI_REVIEW_PROXY_TOKEN:-}"

  identity:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:${SAPPHIRE_IDENTITY_PORT:-8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: "${SAPPHIRE_IDENTITY_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${SAPPHIRE_IDENTITY_ADMIN_PASSWORD:?Set SAPPHIRE_IDENTITY_ADMIN_PASSWORD}"
      SAPPHIRE_AUTH_URL: http://localhost:${WEB_PORT:-8080}
      SAPPHIRE_OIDC_CLIENT_SECRET: "${SAPPHIRE_OIDC_CLIENT_SECRET:?Set SAPPHIRE_OIDC_CLIENT_SECRET}"
    ports:
      - "127.0.0.1:${SAPPHIRE_IDENTITY_PORT:-8180}:8080"
    volumes:
      - identity_data:/opt/keycloak/data
      - ./infra/identity/sapphire-realm.json:/opt/keycloak/data/import/sapphire-realm.json:ro
    networks: [sapphire_ingress]
    restart: unless-stopped

volumes:
  identity_data:
